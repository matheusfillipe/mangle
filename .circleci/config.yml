version: 2.1

commands:
  checkout-https:
    description: Clone over HTTPS so no SSH deploy key is required.
    steps:
      - run:
          name: Checkout over HTTPS
          command: |
            git clone "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .
            git checkout "$CIRCLE_SHA1"

workflows:
  build_and_deploy:
    jobs:
      - build-and-test:
          filters:
            tags:
              only: /.*/

      - pipy-deploy:
          requires:
            - build-and-test
          filters:
            tags:
              only: /^v[0-9]+(\.[0-9]+)*$/
            branches:
              ignore: /.*/
      - crates-deploy:
          requires:
            - build-and-test
          filters:
            tags:
              only: /^v[0-9]+(\.[0-9]+)*$/
            branches:
              ignore: /.*/

jobs:
  build-and-test:
    docker:
      - image: cimg/rust:1.90.0
    steps:
      - checkout-https
      - run:
          name: Version information
          command: rustc --version; cargo --version
      - run:
          name: Calculate dependencies
          command: cargo generate-lockfile
      - run:
          name: Coverage setup
          command: |
            sudo apt update
            sudo apt install -y llvm
            curl -L https://github.com/mozilla/grcov/releases/latest/download/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf -
            curl -Os https://uploader.codecov.io/latest/linux/codecov
            chmod +x codecov
            rustup component add llvm-tools-preview
      - restore_cache:
          keys:
            - v1-cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}
      - run:
          name: Build
          command: cargo build
      - save_cache:
          paths:
            - /usr/local/cargo/registry
            - target/debug/.fingerprint
            - target/debug/build
            - target/debug/deps
          key: v1-cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}
      - run:
          name: Run tests with coverage
          environment:
            RUSTFLAGS: "-Cinstrument-coverage"
            LLVM_PROFILE_FILE: "mangle-%p-%m.profraw"
          command: cargo test
      - run:
          name: Upload coverage
          command: |
            ./grcov . --binary-path ./target/debug/ -s . -t lcov --branch --ignore-not-existing --ignore "/*" -o lcov.info
            ./codecov -f lcov.info

  pipy-deploy:
    docker:
      - image: ghcr.io/pyo3/maturin
    steps:
      - checkout-https
      - run:
          name: Publish to PyPI
          command: |
            ./version_pump.sh
            cd python/
            maturin publish --non-interactive

  crates-deploy:
    docker:
      - image: cimg/rust:1.90.0
    steps:
      - checkout-https
      - run:
          name: Calculate dependencies
          command: cargo generate-lockfile
      - restore_cache:
          keys:
            - v1-cargo-cache-{{ arch }}-{{ checksum "Cargo.lock" }}
      - run:
          name: Publish to crates.io
          command: |
            ./version_pump.sh
            cargo publish --allow-dirty
